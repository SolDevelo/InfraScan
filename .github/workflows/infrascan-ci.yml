name: InfraScan Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  infrascan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # ── Scan ─────────────────────────────────────────────────────────────────
      - name: Run InfraScan
        uses: soldevelo/infrascan@v1.1.0
        with:
          scanner: comprehensive
          format: html
          out: infrascan-report.html
          pr-comment: 'true'
          step-summary: 'true'
          alert-on: 'critical'

      # ── Upload full HTML report ─────────────────────────────────────────────
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrascan-report
          path: infrascan-report.html
          retention-days: 14

