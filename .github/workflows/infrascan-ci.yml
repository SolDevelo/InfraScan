name: InfraScan Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  infrascan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # action.yml runs the image released with it; a release bumps that tag
      # together with __version__, so a mismatch means one was missed.
      - name: Check the action's image matches the CLI version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"$/\1/p' cli.py)
          if ! grep -q "'soldevelo/infrascan:${version}'" action.yml; then
            echo "::error file=action.yml::action.yml doesn't default to soldevelo/infrascan:${version} (cli.py __version__)"
            exit 1
          fi

      # Scan with the image built from this branch, not the released one
      - name: Build InfraScan image from current branch
        run: docker build -t soldevelo/infrascan:ci .

      # ── Scan ─────────────────────────────────────────────────────────────────
      - name: Run InfraScan
        uses: ./
        with:
          image: soldevelo/infrascan:ci
          scanner: comprehensive
          format: html
          out: infrascan-report.html
          pr-comment: 'true'
          step-summary: 'true'
          alert-on: 'any_new'
          max-pr-findings: 10
          min-cost-delta: 0

      # ── Upload full HTML report ─────────────────────────────────────────────
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrascan-report
          path: infrascan-report.html
          retention-days: 14

