name: InfraScan Audit

on:
  push:
    branches: [main]
  pull_request:

permissions:
  pull-requests: write
  contents: read

jobs:
  infrascan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # TODO: remove this step once the action is published to the marketplace and the image is available on Docker Hub
      - name: Build InfraScan image from current branch
        run: docker build -t soldevelo/infrascan:latest .

      # ── Scan ─────────────────────────────────────────────────────────────────
      - name: Run InfraScan
        # TODO: replace with `uses: soldevelo/infrascan-action@v1` once the action is published to the marketplace
        uses: ./
        with:
          scanner: comprehensive
          format: html
          out: infrascan-report.html
          pr-comment: 'true'
          step-summary: 'true'
          alert-on: 'critical'

      # ── Upload full HTML report ─────────────────────────────────────────────
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: infrascan-report
          path: infrascan-report.html
          retention-days: 14

