name: 'InfraScan – IaC Cost & Security Scanner'
description: 'Scan IaC (Terraform, K8s, Helm, CloudFormation, Ansible) for security, Terraform for cost, and containers for CVEs in CI/CD'
author: 'SolDevelo'
branding:
  icon: 'alert-triangle'
  color: 'green'
inputs:
  directory:
    description: 'Directory to scan (relative to repository root)'
    required: false
    default: '.'
  scanner:
    description: 'Scanner to use (regex, checkov, containers, comprehensive)'
    required: false
    default: 'comprehensive'
  format:
    description: 'Output format (text, json, html)'
    required: false
    default: 'text'
  out:
    description: 'Output file path (e.g., infrascan-report.html)'
    required: false
    default: ''
  framework:
    description: 'Framework (smart, auto, terraform, kubernetes, cloudformation, helm, ansible, all)'
    required: false
    default: 'smart'
  download-external-modules:
    description: 'Allow Checkov to download external modules'
    required: false
    default: 'false'
  fail-on:
    description: 'Fail threshold (e.g., high_critical, any, grade_c)'
    required: false
    default: ''
  slack-webhook-url:
    description: 'Slack Incoming Webhook URL for scan notifications (optional)'
    required: false
    default: ''
  docker-hub-username:
    description: 'Docker Hub username -- enables Docker Scout for container scanning (fewer false positives); without it Grype is used'
    required: false
    default: ''
  docker-hub-password:
    description: 'Docker Hub password or access token (pass a secret) for docker-hub-username'
    required: false
    default: ''
  container-ignore-images:
    description: 'Regex of container images to skip, e.g. images this repo builds itself that are only published after merge'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for PR comments and annotations (defaults to the built-in token)'
    required: false
    default: ${{ github.token }}
  pr-comment:
    description: 'Post/update a PR comment when actionable findings exist (true|false)'
    required: false
    default: 'true'
  step-summary:
    description: 'Write scan results to the GitHub Actions step summary (true|false)'
    required: false
    default: 'true'
  alert-on:
    description: 'Severity threshold for PR comments and annotations (critical|high|medium|low|any_new|none)'
    required: false
    default: 'any_new'
  min-cost-delta:
    description: 'Minimum cost delta ($/month) to trigger PR comment (default: 0 = any change)'
    required: false
    default: '0'
  max-pr-findings:
    description: 'Maximum total findings to show in PR comments, sorted by severity (default: 10)'
    required: false
    default: '10'
  baseline:
    description: 'Path to an explicit baseline JSON (overrides auto-baseline; leave blank to let the action manage it)'
    required: false
    default: ''
  auto-baseline:
    description: 'Automatically cache and compare against the base-branch baseline (true|false)'
    required: false
    default: 'true'
  skip-if-no-match:
    description: 'Skip scan if no files matching scanner patterns were changed (PRs only)'
    required: false
    default: 'true'
outputs:
  triggered-by-paths:
    description: 'Newline-separated list of changed files that triggered this scan'
    value: ${{ steps.run-infrascan.outputs.triggered-by-paths }}
runs:
  using: 'composite'
  steps:
    - name: Check changed files
      id: check-files
      if: inputs.skip-if-no-match == 'true' && github.event_name == 'pull_request'
      shell: bash
      run: |
        # actions/checkout fetches only the PR's merge commit, so the base
        # isn't there to diff against -- fetch that one commit. A plain
        # two-tree diff needs no merge-base, so depth 1 is enough. If the
        # fetch fails, CHANGED is empty and the scan runs (never skipped).
        BASE_SHA="${{ github.event.pull_request.base.sha }}"
        git fetch --no-tags --depth=1 origin "$BASE_SHA" 2>/dev/null || true
        CHANGED=$(git diff --name-only "$BASE_SHA" HEAD 2>/dev/null || true)
        if [ -z "$CHANGED" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # Query patterns from the scanner image; fall back to a safe hard-coded set
        PATTERNS=$(docker run --rm "soldevelo/infrascan:latest" cli --list-patterns \
          --scanner "${{ inputs.scanner }}" 2>/dev/null \
          | python3 -c "import json,sys; [print(p) for p in json.load(sys.stdin).get('patterns',[])]" \
          2>/dev/null || printf '\.tf$\n\.tfvars$\n\.hcl$\n\.ya?ml$\nDockerfile')
        MATCH=false
        while IFS= read -r pat; do
          if echo "$CHANGED" | grep -qE "$pat"; then
            MATCH=true
            break
          fi
        done <<< "$PATTERNS"
        echo "skip=$( [ $MATCH = true ] && echo false || echo true )" >> "$GITHUB_OUTPUT"
        echo "triggered-by-paths<<EOF" >> "$GITHUB_OUTPUT"
        echo "$CHANGED" >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    # ── Grype vulnerability DB cache ──────────────────────────────────────────
    # Grype's DB (~175 MB download, ~3 GB unpacked) otherwise costs ~2.5 min
    # per run. Anchore publishes one a day, so key on the date: the first run
    # of the day restores yesterday's, Grype updates it, and it's saved under
    # today's key; later runs that day hit it exactly and download nothing.
    - name: Grype DB cache key
      id: grype-db-key
      if: steps.check-files.outputs.skip != 'true' && (inputs.scanner == 'comprehensive' || contains(inputs.scanner, 'containers'))
      shell: bash
      run: echo "key=infrascan-grype-db-$(date -u +%Y-%m-%d)" >> "$GITHUB_OUTPUT"

    - name: Restore Grype DB cache
      id: grype-db-cache
      if: steps.grype-db-key.outputs.key != ''
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/infrascan-grype-db
        key: ${{ steps.grype-db-key.outputs.key }}
        restore-keys: |
          infrascan-grype-db-

    # ── Baseline cache restore ────────────────────────────────────────────────
    # Key on the BASE branch commit SHA so the cache is invalidated when the
    # target branch advances, not when the PR branch changes files. Pushes to
    # the default branch save it under that key (see "Save default-branch
    # baseline cache"); a cache saved by a PR run is only visible to that PR.
    - name: Restore baseline cache
      id: baseline-cache
      if: inputs.auto-baseline == 'true' && inputs.baseline == '' && github.event_name == 'pull_request' && steps.check-files.outputs.skip != 'true'
      uses: actions/cache/restore@v4
      with:
        path: ${{ runner.temp }}/infrascan-baseline.json
        key: infrascan-${{ github.base_ref }}-${{ github.event.pull_request.base.sha }}
        restore-keys: |
          infrascan-${{ github.base_ref }}-

    # ── Baseline fallback: scan base branch when cache is cold ────────────────
    - name: Scan base branch (baseline fallback)
      id: baseline-scan
      if: inputs.auto-baseline == 'true' && inputs.baseline == '' && github.event_name == 'pull_request' && steps.baseline-cache.outputs.cache-hit != 'true' && steps.check-files.outputs.skip != 'true'
      shell: bash
      run: |
        git fetch --depth=1 origin ${{ github.base_ref }} 2>/dev/null || true
        git worktree add "$RUNNER_TEMP/base-worktree" origin/${{ github.base_ref }}
        mkdir -p "$RUNNER_TEMP/baseline-out"
        chmod 777 "$RUNNER_TEMP/baseline-out"
        # Same scanner settings as the PR scan below -- a baseline scanned
        # differently (other container scanner, other framework, images
        # not ignored) makes the delta report false "new" findings.
        CONTAINER_ENV=()
        if [ -n "${{ inputs.docker-hub-username }}" ]; then
          CONTAINER_ENV+=(
            -e DOCKER_HUB_USERNAME="${{ inputs.docker-hub-username }}"
            -e DOCKER_HUB_PASSWORD="${{ inputs.docker-hub-password }}"
          )
        fi
        if [ -n "${{ inputs.container-ignore-images }}" ]; then
          CONTAINER_ENV+=(-e CONTAINER_IGNORE_IMAGES="${{ inputs.container-ignore-images }}")
        fi
        # Shared Grype DB (see "Grype DB cache" above). The scan containers
        # run as other users than the runner and write the DB owner-only, so
        # open it up from a root container -- a host chmod can't touch files
        # an earlier container created.
        mkdir -p "$RUNNER_TEMP/infrascan-grype-db"
        docker run --rm --user root --entrypoint chmod -v "$RUNNER_TEMP/infrascan-grype-db:/grype-db" \
          "soldevelo/infrascan:latest" -R a+rwX /grype-db
        CONTAINER_ENV+=(-e GRYPE_DB_CACHE_DIR=/grype-db -v "$RUNNER_TEMP/infrascan-grype-db:/grype-db")
        docker run --rm \
          "${CONTAINER_ENV[@]}" \
          -v "$RUNNER_TEMP/base-worktree:/scan:ro" \
          -v "$RUNNER_TEMP/baseline-out:/output" \
          "soldevelo/infrascan:latest" \
          cli "/scan/${{ inputs.directory }}" --scanner "${{ inputs.scanner }}" --framework "${{ inputs.framework }}" \
          --format json --out /output/infrascan-baseline.json
        cp "$RUNNER_TEMP/baseline-out/infrascan-baseline.json" "$RUNNER_TEMP/infrascan-baseline.json"

    - name: Run InfraScan
      id: run-infrascan
      if: steps.check-files.outputs.skip != 'true'
      shell: bash
      run: |
        if [ "${{ steps.check-files.outputs.skip }}" = "true" ]; then
          echo "::notice::InfraScan skipped — no supported files changed."
          exit 0
        fi

        SLACK_ENV=()
        if [ -n "${{ inputs.slack-webhook-url }}" ]; then
          SLACK_ENV=(
            -e SLACK_WEBHOOK_URL="${{ inputs.slack-webhook-url }}"
          )
        fi

        CONTAINER_ENV=()
        if [ -n "${{ inputs.docker-hub-username }}" ]; then
          CONTAINER_ENV+=(
            -e DOCKER_HUB_USERNAME="${{ inputs.docker-hub-username }}"
            -e DOCKER_HUB_PASSWORD="${{ inputs.docker-hub-password }}"
          )
        fi
        if [ -n "${{ inputs.container-ignore-images }}" ]; then
          CONTAINER_ENV+=(-e CONTAINER_IGNORE_IMAGES="${{ inputs.container-ignore-images }}")
        fi
        mkdir -p "$RUNNER_TEMP/infrascan-grype-db"
        docker run --rm --user root --entrypoint chmod -v "$RUNNER_TEMP/infrascan-grype-db:/grype-db" \
          "soldevelo/infrascan:latest" -R a+rwX /grype-db
        CONTAINER_ENV+=(-e GRYPE_DB_CACHE_DIR=/grype-db -v "$RUNNER_TEMP/infrascan-grype-db:/grype-db")

        # Mount event file and a writable step-summary file into the container
        SUMMARY_TMP="$(mktemp)"
        GH_ENV=(
          -e GITHUB_TOKEN="${{ inputs.github-token }}"
          -e GITHUB_EVENT_PATH="/github/workflow/event.json"
          -e GITHUB_STEP_SUMMARY="/github/workflow/step_summary.md"
          -e GITHUB_REPOSITORY="${{ github.repository }}"
          -e GITHUB_WORKFLOW="${{ github.workflow }}"
          -e GITHUB_REF_NAME="${{ github.ref_name }}"
          -e GITHUB_ACTOR="${{ github.actor }}"
          -e GITHUB_RUN_ID="${{ github.run_id }}"
          -e GITHUB_SERVER_URL="${{ github.server_url }}"
          -e GITHUB_ACTIONS="true"
          -v "${GITHUB_EVENT_PATH}:/github/workflow/event.json:ro"
          -v "${SUMMARY_TMP}:/github/workflow/step_summary.md"
        )

        BASELINE_MOUNT=()
        BASELINE_ARG=()
        # Explicit baseline takes priority; otherwise use the auto-managed base-branch scan
        BASELINE_FILE="${{ inputs.baseline }}"
        if [ -z "$BASELINE_FILE" ] && [ -f "$RUNNER_TEMP/infrascan-baseline.json" ]; then
          BASELINE_FILE="$RUNNER_TEMP/infrascan-baseline.json"
        fi
        if [ -n "$BASELINE_FILE" ] && [ -f "$BASELINE_FILE" ]; then
          BASELINE_MOUNT=(-v "$BASELINE_FILE:/infrascan-baseline.json:ro")
          BASELINE_ARG=(--baseline "/infrascan-baseline.json")
        fi

        # A push to the default branch is exactly the scan PRs compare
        # against, so it also writes the baseline for them (saved below).
        BASELINE_OUT_MOUNT=()
        if [ "${{ inputs.auto-baseline }}" = "true" ] && [ -z "${{ inputs.baseline }}" ] \
            && [ "${{ github.event_name }}" = "push" ] \
            && [ "${{ github.ref }}" = "refs/heads/${{ github.event.repository.default_branch }}" ]; then
          mkdir -p "$RUNNER_TEMP/baseline-out"
          chmod 777 "$RUNNER_TEMP/baseline-out"
          BASELINE_OUT_MOUNT=(-v "$RUNNER_TEMP/baseline-out:/baseline-out")
          BASELINE_ARG+=(--baseline-out "/baseline-out/infrascan-baseline.json")
        fi

        CMD=(docker run --rm --user root
          "${SLACK_ENV[@]}"
          "${CONTAINER_ENV[@]}"
          "${GH_ENV[@]}"
          "${BASELINE_MOUNT[@]}"
          "${BASELINE_OUT_MOUNT[@]}"
          -v "${{ github.workspace }}:/scan"
          "soldevelo/infrascan:latest"
          cli "/scan/${{ inputs.directory }}"
        )

        CMD+=(--scanner "${{ inputs.scanner }}")
        CMD+=(--format "${{ inputs.format }}")
        CMD+=(--framework "${{ inputs.framework }}")
        CMD+=(--alert-on "${{ inputs.alert-on }}")
        CMD+=(--pr-comment "${{ inputs.pr-comment }}")
        CMD+=(--step-summary "${{ inputs.step-summary }}")
        CMD+=(--min-cost-delta "${{ inputs.min-cost-delta }}")
        CMD+=(--max-pr-findings "${{ inputs.max-pr-findings }}")
        CMD+=("${BASELINE_ARG[@]}")

        if [ -n "${{ inputs.out }}" ]; then
          CMD+=(--out "/scan/${{ inputs.out }}")
        elif [ "${{ inputs.format }}" = "html" ]; then
          CMD+=(--out "/scan/infrascan-report.html")
        elif [ "${{ inputs.format }}" = "json" ]; then
          CMD+=(--out "/scan/infrascan-report.json")
        fi

        if [ "${{ inputs.download-external-modules }}" = "true" ]; then
          CMD+=(--download-external-modules)
        fi

        if [ -n "${{ inputs.fail-on }}" ]; then
          CMD+=(--fail-on "${{ inputs.fail-on }}")
        fi

        echo "Running InfraScan:"
        echo "${CMD[*]}"
        # `|| EXIT_CODE=$?`: the step shell runs with -e, which would
        # otherwise exit here on fail-on before the summary is appended.
        EXIT_CODE=0
        "${CMD[@]}" || EXIT_CODE=$?

        if [ -s "$RUNNER_TEMP/baseline-out/infrascan-baseline.json" ] && [ ${#BASELINE_OUT_MOUNT[@]} -gt 0 ]; then
          cp "$RUNNER_TEMP/baseline-out/infrascan-baseline.json" "$RUNNER_TEMP/infrascan-baseline.json"
          echo "baseline-written=true" >> "$GITHUB_OUTPUT"
        fi

        # Append container-written step summary to GitHub's GITHUB_STEP_SUMMARY
        if [ -n "${SUMMARY_TMP:-}" ] && [ -s "${SUMMARY_TMP}" ]; then
          cat "${SUMMARY_TMP}" >> "$GITHUB_STEP_SUMMARY"
          rm -f "${SUMMARY_TMP}"
        fi

        exit $EXIT_CODE

    # ── Save baseline to cache (only when freshly scanned from base branch) ────
    # The file at this point is always a scan of the base branch — never the PR
    # branch — so later runs of this PR against the same base commit reuse it.
    # always(): a PR scan that fails via fail-on doesn't make the baseline bad.
    - name: Save baseline cache
      if: always() && steps.baseline-scan.outcome == 'success'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/infrascan-baseline.json
        key: infrascan-${{ github.base_ref }}-${{ github.event.pull_request.base.sha }}

    # Saved from the default branch itself, so every PR can restore it --
    # GitHub scopes caches saved by a PR run to that PR only.
    - name: Save default-branch baseline cache
      if: always() && steps.run-infrascan.outputs.baseline-written == 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/infrascan-baseline.json
        key: infrascan-${{ github.ref_name }}-${{ github.sha }}

    # ── Save Grype DB cache ────────────────────────────────────────────────────
    # always(): a scan that fails the job via fail-on still downloaded a
    # perfectly good DB -- don't make every failing run re-download it.
    - name: Prepare Grype DB cache for saving
      if: always() && steps.grype-db-key.outputs.key != '' && steps.grype-db-cache.outputs.cache-hit != 'true'
      shell: bash
      run: |
        # The DB was written by the scan containers (owner-only, other uids);
        # the save step's tar runs as the runner user and must read it.
        [ -d "$RUNNER_TEMP/infrascan-grype-db" ] || exit 0
        docker run --rm --user root --entrypoint chmod -v "$RUNNER_TEMP/infrascan-grype-db:/grype-db" \
          "soldevelo/infrascan:latest" -R a+rwX /grype-db

    - name: Save Grype DB cache
      if: always() && steps.grype-db-key.outputs.key != '' && steps.grype-db-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: ${{ runner.temp }}/infrascan-grype-db
        key: ${{ steps.grype-db-key.outputs.key }}
