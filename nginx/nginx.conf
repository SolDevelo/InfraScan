# Shared across nginx's own workers (unlike per-process app-level state), keyed by client IP.
# ~10 req/5min sustained, with a burst allowance for a legitimate scan flow's single save call.
limit_req_zone $binary_remote_addr zone=results_save:10m rate=2r/m;

# Scanning clones a repo and runs scanners against it (up to the 600s proxy timeout below),
# so it's far more expensive per-request than results_save -- only 2 gunicorn workers total,
# so a handful of concurrent scans can already exhaust the backend.
limit_req_zone $binary_remote_addr zone=scan_github:10m rate=6r/m;

# Also unauthenticated: does an outbound GitHub API call plus an untimed `git ls-remote`,
# so it can tie up a worker and burn the app's shared GitHub API quota if hammered.
limit_req_zone $binary_remote_addr zone=repo_branches:10m rate=10r/m;

server {
    listen 80;
    server_name infrascan.soldevelo.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name infrascan.soldevelo.com;

    ssl_certificate /etc/letsencrypt/live/infrascan.soldevelo.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/infrascan.soldevelo.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    
    # Security headers for SEO
    include /etc/nginx/security_headers.inc;

    client_max_body_size 10M;

    location = /api/results/save {
        limit_req zone=results_save burst=10 nodelay;
        limit_req_status 429;

        include /etc/nginx/proxy_backend.inc;
        include /etc/nginx/security_headers.inc;
    }

    location = /api/scan/github {
        limit_req zone=scan_github burst=3 nodelay;
        limit_req_status 429;

        include /etc/nginx/proxy_backend.inc;
        include /etc/nginx/security_headers.inc;
    }

    location = /api/repo/branches {
        limit_req zone=repo_branches burst=5 nodelay;
        limit_req_status 429;

        include /etc/nginx/proxy_backend.inc;
        include /etc/nginx/security_headers.inc;
    }

    location / {
        include /etc/nginx/proxy_backend.inc;

        # Cache headers for HTML (no-cache to get fresh content, but browser can revalidate)
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/security_headers.inc;
    }

    location /static/ {
        alias /opt/infrascan/static/;
        # Cache static assets for 1 year
        expires 365d;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        include /etc/nginx/security_headers.inc;
    }

    location = /robots.txt {
        alias /opt/infrascan/static/robots.txt;
        # Cache robots.txt for 24 hours
        add_header Cache-Control "public, max-age=86400" always;
        add_header Content-Type "text/plain; charset=utf-8" always;
        include /etc/nginx/security_headers.inc;
    }

    # Error pages
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}
