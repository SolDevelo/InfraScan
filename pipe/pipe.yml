# Bitbucket Pipe metadata. Schema per:
# https://support.atlassian.com/bitbucket-cloud/docs/write-a-pipe-for-bitbucket-pipelines/
#
# `image` is the same soldevelo/infrascan image the GitHub Action uses --
# no separate pipe image to build or maintain.
#
# entrypoint.sh detects a bare, zero-argv invocation with BITBUCKET_CLONE_DIR
# set (exactly how Bitbucket runs a `pipe: docker://...` reference) and
# routes to pipe.sh, which translates the variables below into the
# equivalent cli.py flags.
name: InfraScan
pipe: soldevelo/infrascan
image: soldevelo/infrascan:latest
description: >-
  Scan Terraform, Kubernetes and Docker for cost inefficiencies and security
  issues. Posts a PR comment, a Code Insights report, and inline annotations
  automatically.
maintainer: SolDevelo <support@soldevelo.com>
repository: https://github.com/soldevelo/infrascan
website: https://github.com/soldevelo/infrascan
vendor:
  name: SolDevelo
  link: https://soldevelo.com
tags:
  - security
  - cost
  - terraform
  - kubernetes
  - docker
  - iac
variables:
  - name: BITBUCKET_ACCESS_TOKEN
    default: ""
    description: >-
      Only required for the PR comment -- the Code Insights report and
      annotations authenticate automatically via Bitbucket's own Reports
      API proxy, no token needed. Create a Repository Access Token
      (Repository settings > Access tokens) with pullrequest:write, store
      it as a secured repository variable, and pass it through:
      BITBUCKET_ACCESS_TOKEN: $YOUR_VARIABLE_NAME. Without it, everything
      else still works but the PR comment is skipped.
  - name: DIRECTORY
    default: "."
    description: Directory to scan, relative to the repository root.
  - name: SCANNER
    default: comprehensive
    description: "Scanner to run: regex, checkov, containers, or comprehensive."
  - name: FORMAT
    default: html
    description: "Output format: text, json, or html."
  - name: OUT
    default: infrascan-report.html
    description: Output file path, relative to the repository root.
  - name: FRAMEWORK
    default: smart
    description: "IaC framework: smart, auto, terraform, kubernetes, cloudformation, helm, ansible, or all."
  - name: ALERT_ON
    default: any_new
    description: "Severity threshold for PR comments and annotations: critical, high, medium, low, any_new, or none."
  - name: MIN_COST_DELTA
    default: "0"
    description: Minimum cost delta ($/month) to highlight in the PR comment.
  - name: MAX_PR_FINDINGS
    default: "10"
    description: Maximum total findings shown in the PR comment.
  - name: DOCKER_HUB_USERNAME
    default: ""
    description: Docker Hub username. With DOCKER_HUB_PASSWORD, container images are scanned with Docker Scout (fewer false positives); without them, Grype is used -- Scout needs a Docker login even on a free account.
  - name: DOCKER_HUB_PASSWORD
    default: ""
    description: Docker Hub password or access token for DOCKER_HUB_USERNAME (use a secured repository variable).
  - name: CONTAINER_SCANNER
    default: ""
    description: Force a container scanner ("grype" or "docker-scout"). Default picks Docker Scout when Docker Hub credentials are set, Grype otherwise.
  - name: CONTAINER_IGNORE_IMAGES
    default: ""
    description: Regex of container images to skip, e.g. "-SNAPSHOT$" for images this repo builds itself and only publishes after merge -- on a PR the registry only has the previous build.
  - name: GRYPE_DB_CACHE
    default: infrascan-grype-db
    description: Directory (and Bitbucket cache name) holding Grype's vulnerability DB. Only used if the directory exists, i.e. you declared the cache -- see docs/BITBUCKET_PIPELINE.md. Scans always use a current DB; when a newer one is published the pipe replaces the cache so later runs skip the download.
  - name: MAX_ANNOTATIONS_PER_IMAGE
    default: "10"
    description: Maximum Code Insights annotations per container image, sorted by severity ("0" = no cap). Keeps one noisy image's CVE list from drowning out every other finding; doesn't affect grading, the PR comment, or the report.
  - name: FAIL_ON
    default: never
    description: "Exit-code-1 threshold: never (default), new_high_critical, new_critical, new_any (only findings the PR adds; skipped on the default branch), any, high_critical, grade_a-grade_f, priority_critical-priority_info."
  - name: BASELINE
    default: infrascan-baseline/infrascan-baseline.json
    description: Path (relative to the repository root) read for cost/finding delta, if present. Missing file is treated as "no baseline" -- safe by default, no setup required beyond declaring the cache (see docs/BITBUCKET_PIPELINE.md).
  - name: BASELINE_OUT
    default: infrascan-baseline/infrascan-baseline.json
    description: Path (relative to the repository root) this scan's result is written to as JSON, for the next run's baseline -- but only on a push to DEFAULT_BRANCH that isn't a PR (auto-detected from BITBUCKET_BRANCH/BITBUCKET_PR_ID). Written regardless of FORMAT/OUT, so one invocation produces both the report and the next baseline.
  - name: DEFAULT_BRANCH
    default: main
    description: Branch name whose scans refresh the shared baseline (BASELINE_OUT is only actually used on this branch). Set to your real default branch if it isn't "main".
  - name: DOWNLOAD_EXTERNAL_MODULES
    default: "false"
    description: Allow Checkov to download external Terraform modules ("true"/"false").
